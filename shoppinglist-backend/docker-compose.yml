version: '3.8'

services:
  shoppinglist-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shoppinglist-backend
    ports:
      - "8080:8080"
    environment:
      - DB_USERNAME=${DB_USERNAME:-shoppinglist}
      - DB_PASSWORD=${DB_PASSWORD:-shoppinglist123}
      - DB_URL=jdbc:postgresql://host.docker.internal:5432/shoppinglist
      - SHOPPINGLIST_API_KEY=${SHOPPINGLIST_API_KEY:-dev-api-key-12345}
    depends_on:
      - postgresql
    networks:
      - shoppinglist-network
    restart: unless-stopped

  # Hinweis: PostgreSQL ist bereits als Container vorhanden
  # Diese Konfiguration dient nur als Referenz
  # postgresql:
  #   image: postgres:15-alpine
  #   container_name: shoppinglist-postgres
  #   environment:
  #     POSTGRES_DB: shoppinglist
  #     POSTGRES_USER: shoppinglist
  #     POSTGRES_PASSWORD: shoppinglist123
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - shoppinglist-network

networks:
  shoppinglist-network:
    driver: bridge

